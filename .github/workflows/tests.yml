# Test a ogni push/PR: garantisce che main resti sempre funzionante.
name: tests
on:
  push:
    paths-ignore: ["data/**", "docs/**", "site/**", "*.md"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - run: pip install -q -c requirements-ci.txt -e ".[dev]"
      - name: Controllo statico (ruff)
        run: ruff check .
      - name: Suite completa
        run: python -m pytest -q

  site:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - run: pip install -q -c requirements-ci.txt -e ".[dev]"
      - name: Build offline sui dati versionati
        run: fda build
      - name: Tutti i gate prima del merge
        run: |
          set -euo pipefail
          python scripts/verify_site.py --site site --data data/processed
          python scripts/parita_schede.py site
          python -m scripts.resa_375
      - name: Conserva la build per i test browser
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site-smoke
          path: site
          retention-days: 1

  browser:
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-smoke
          path: site
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Report browser e screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-results
          path: browser-results
          retention-days: 7

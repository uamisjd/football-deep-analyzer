# Run giornaliero: raccolta dati → modelli → sito → commit dati → pubblicazione su GitHub Pages.
# Parte su push in `main` (pubblicazione subito dopo un merge) e agli orari schedulati.
# Orari in UTC (l'ora italiana è UTC+2 d'estate, UTC+1 d'inverno).
# Nota: gli orari schedulati sono nominali — GitHub li avvia con ritardo (misurato:
# in media 3,2 ore, da 1h39m a 5h23m sugli ultimi 20 run), quindi non sono puntuali.
name: daily

on:
  # Pubblica anche subito dopo un merge in `main`: senza questo trigger il sito restava
  # fermo a quello costruito dal run precedente fino all'orario schedulato successivo
  # (in media 3,2 ore, fino a 7). Non c'è rischio di loop: i commit dei dati portano
  # "[skip ci]" e i push fatti con GITHUB_TOKEN non riattivano i workflow.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  schedule:
    - cron: "7 4 * * *"     # 06:00 IT (estate) — run principale del mattino
    - cron: "11 10 * * *"    # 12:00 IT — infortuni/formazioni/meteo
    - cron: "17 14 * * *"    # 16:00 IT
    - cron: "23 18 * * *"    # 20:00 IT — risultati pomeridiani
    - cron: "30 21 * * *"   # 23:30 IT — risultati serali
  workflow_dispatch:        # avvio manuale dal tab "Actions" → "Run workflow"
    inputs:
      leagues:
        description: "Campionati (es. ITA1 ENG1), vuoto = tutti"
        required: false
        default: ""
      skip_predict:
        description: "Salta i modelli"
        type: boolean
        default: false
      prova_allerta:
        description: "Fallisce di proposito a fine run, per provare l'apertura della issue di guasto (docs/41 §6)"
        type: boolean
        default: false
      forza_commit:
        description: "Salva i dati nel repository anche se la fotografia di oggi è già salvata (docs/105)"
        type: boolean
        default: false

# Un solo run alla volta: evita conflitti sui commit dei dati
concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # solo questo job salva i dati
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt

      - name: Installa il pacchetto (con dipendenze dev per i test)
        run: pip install -q -c requirements-ci.txt -e ".[dev]"

      # Cache HTTP su disco fra un run e l'altro (rispetto delle fonti, misurato il
      # 05/10/2026 su `source_status`): `data/cache/` non è versionato e il checkout
      # riparte da una cartella vuota (`clean: true`), quindi le TTL dichiarate in
      # `config/sources.yaml` — notizie 12 h, mercato 24 h, calendario 6 h — valevano solo
      # **dentro** un run. Costo reale misurato sugli ultimi 8 giorni: 676 richieste/giorno
      # a FotMob per il mercato (132 squadre × 5 run) e 692 a Google News per le notizie,
      # quando la TTL dichiarata ne prevede ~132 e ~264. Con la cache persistente è la TTL
      # a decidere, non il numero di run. `continue-on-error` su entrambi i passi: un
      # problema di cache (quota, restore) non deve mai fermare il run — la raccolta
      # funziona identica, solo con più richieste.
      - name: Ripristina la cache HTTP dei run precedenti
        id: cache-http
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/cache
          key: fda-http-${{ github.run_id }}
          restore-keys: fda-http-

      - name: Test rapidi (parser offline)
        run: python -m pytest -q -x tests/test_fotmob.py tests/test_understat_espn.py tests/test_config.py

      - name: Run giornaliero (collect → predict → backtest → simulate → build)
        env:
          PYTHONUNBUFFERED: "1"
          FDA_LEAGUES: ${{ inputs.leagues }}
          FDA_SKIP_PREDICT: ${{ inputs.skip_predict }}
        run: |
          set -euo pipefail   # senza pipefail il fallimento di `fda daily` veniva mascherato dalla pipe
          read -r -a ARGS <<< "$FDA_LEAGUES"
          FLAGS=()
          if [ "$FDA_SKIP_PREDICT" = "true" ]; then FLAGS=(--skip-predict); fi
          fda daily "${ARGS[@]}" "${FLAGS[@]}" 2>&1 | tee run.log | tail -80

      # Dopo `fda daily` la cache è completa (le fasi successive non fanno richieste):
      # si salva qui, anche se la raccolta è fallita a metà, così il run seguente riparte
      # da ciò che è già stato scaricato. Chiave nuova a ogni run (le cache di Actions sono
      # immutabili) e `restore-keys` sul prefisso: GitHub tiene le più recenti ed elimina
      # le vecchie da solo (LRU, 10 GB per repository).
      - name: Prepara la cartella della cache HTTP
        if: always() && steps.cache-http.outcome == 'success'
        run: mkdir -p data/cache

      - name: Salva la cache HTTP per il run successivo
        if: always() && steps.cache-http.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/cache
          key: fda-http-${{ github.run_id }}

      # Invarianti di pubblicazione (docs/19 P0.8, §18.5): verify_site rilegge i numeri
      # pubblicati e li confronta con i Parquet e con il modello. Un numero che non torna
      # fallisce il run PRIMA del commit dei dati e del deploy Pages (prima si girava solo
      # in locale: il gate in CI era una voce «da confermare» rimasta vuota).
      - name: Verifica il sito (verify_site)
        run: |
          set -euo pipefail
          python scripts/verify_site.py --site site --data data/processed 2>&1 | tee verify.log | tail -20

      # Parità fra le schede pre-partita (direttiva utente 2026-09-19: «ogni partita deve avere
      # la stessa alta qualità e quantità»): struttura (gli stessi id di card), indice (le stesse
      # voci) e quantità di testo devono coincidere su **ogni** scheda pre-partita. Una guardia
      # che fa sparire una card su una pagina sola passava tutti i gate senza essere vista
      # («Clima del club», 59 schede su 60, scoperta misurando): ora ferma il run prima del
      # commit dei dati.
      - name: Parità delle schede pre-partita
        run: |
          set -euo pipefail
          python scripts/parita_schede.py site 2>&1 | tee parita.log | tail -20

      # Resa a 375 px (P2.8 di docs/19, docs/39): nessun browser — né qui né nel sandbox — quindi
      # il layout si misura dove è dichiarato. `resa_375.py` legge il CSS pubblicato, prende le
      # metriche dai .woff2 **del sito** (istanza variabile sul peso giusto) e calcola, su ogni
      # pagina pubblicata, la larghezza minima di ogni tabella, l'andata a capo del badge della
      # forma e la larghezza delle etichette dei grafici. Esce 1 se qualcosa non entra: prima di
      # questo gate 4.929 tabelle facevano scorrere la pagina di lato su un telefono.
      # Richiede fontTools (extra "dev": `pip install -e ".[dev]"`).
      - name: Resa a 375 px (resa_375)
        run: |
          set -euo pipefail
          python -m scripts.resa_375 2>&1 | tee resa375.log | tail -20

      # Una fotografia dei dati al giorno (docs/105). I cinque run pubblicano tutti il sito,
      # ma i Parquet aggiornati entrano nel repository **una volta sola**: al run serale
      # (≥ 20 UTC, quello con i risultati della giornata) o al primo run utile se quello è
      # fallito (rete di sicurezza a 24 ore). Misura che motiva la regola (docs/104 §3):
      # 743,8 MB scritti in 30 giorni (~24,8 MB al giorno), pack a 722,85 MiB, verso il
      # limite raccomandato di 1 GB in ~11 giorni. La decisione sta in
      # `scripts/fotografia_dati.py` (funzione pura, 20 test) e legge l'ultima fotografia
      # dalla cronologia stessa del repository: nessun file di stato da conservare.
      # Fail-open: se la lettura non riesce, si committa (meglio una fotografia in più che
      # un buco nell'archivio).
      - name: Fotografia dei dati — decidere se questo run committa (docs/105)
        id: fotografia
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.forza_commit }}" = "true" ]; then
            echo "commit forzato dal dispatch: si salva la fotografia comunque" >&2
            echo "commit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m scripts.fotografia_dati \
            --repo "${{ github.repository }}" --ramo "${{ github.ref_name }}" \
            >> "$GITHUB_OUTPUT" 2> fotografia.log || echo "commit=true" >> "$GITHUB_OUTPUT"
          cat fotografia.log

      - name: Commit dei dati aggiornati (worktree isolato)
        env:
          FDA_BRANCH: ${{ github.ref_name }}
          FDA_FULL_SNAPSHOT: ${{ steps.fotografia.outputs.commit }}
        run: |
          set -euo pipefail
          git config user.name "fda-bot"
          git config user.email "fda-bot@users.noreply.github.com"
          python -m scripts.pubblica_dati --branch "$FDA_BRANCH" --full "$FDA_FULL_SNAPSHOT"

      - name: Prepara il sito per Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      # Prova dell'allerta (`docs/41` §4 voce 1b, `docs/41` §6). Il ramo di guasto
      # dell'allerta non si può esercitare da un branch — la condizione del passo è
      # `failure() && ref_name == ramo predefinito` — e non ha senso scoprire se funziona
      # al primo guasto vero (il 19/09 il sito è rimasto fermo 14h27m in silenzio).
      # Con questo interruttore il run arriva in fondo (dati raccolti, sito generato e
      # impacchettato) e fallisce **solo** all'ultimo passo: nessun dato viene perso
      # (il commit è già stato fatto), il sito pubblicato resta quello del run precedente
      # e la issue si apre con la diagnostica completa dei log. Il run verde successivo
      # la chiude da solo, com'è già successo in produzione il 19/09.
      - name: "Prova dell'allerta (solo su dispatch — fallimento deliberato)"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prova_allerta }}
        run: |
          echo "::warning::fallimento deliberato richiesto da «prova_allerta»: serve solo a verificare l'apertura della issue di guasto"
          exit 1


      - name: Salva diagnostica del run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: run-log-${{ github.run_number }}
          path: |
            run.log
            verify.log
            parita.log
            resa375.log
            fotografia.log
          if-no-files-found: warn
          retention-days: 7

  deploy:
    needs: run
    # Pages pubblica solo dal ramo predefinito (main): sugli altri rami il job viene saltato.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  notify:
    # Solo il risultato END-TO-END autorizza una dichiarazione di ripristino.
    needs: [run, deploy]
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Recupera diagnostica (anche se il deploy è fallito o saltato)
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: run-log-${{ github.run_number }}
      - name: Segnala esito di raccolta e pubblicazione
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FDA_RUN_RESULT: ${{ needs.run.result }}
          FDA_DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: python scripts/ci_alert.py on-result

# Run giornaliero: raccolta dati → modelli → sito → commit dati → pubblicazione su GitHub Pages.
# Orari in UTC (l'ora italiana è UTC+2 d'estate, UTC+1 d'inverno).
name: daily

on:
  schedule:
    - cron: "0 4 * * *"     # 06:00 IT (estate) — run principale del mattino
    - cron: "0 10 * * *"    # 12:00 IT — infortuni/formazioni/meteo
    - cron: "0 14 * * *"    # 16:00 IT
    - cron: "0 18 * * *"    # 20:00 IT — risultati pomeridiani
    - cron: "30 21 * * *"   # 23:30 IT — risultati serali
  workflow_dispatch:        # avvio manuale dal tab "Actions" → "Run workflow"
    inputs:
      leagues:
        description: "Campionati (es. ITA1 ENG1), vuoto = tutti"
        required: false
        default: ""
      skip_predict:
        description: "Salta i modelli"
        type: boolean
        default: false

# Un solo run alla volta: evita conflitti sui commit dei dati
concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write     # per committare data/processed
  pages: write        # per pubblicare il sito
  id-token: write     # richiesto da deploy-pages

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installa il pacchetto (con dipendenze dev per i test)
        run: pip install -q -e ".[dev]"

      - name: Test rapidi (parser offline)
        run: python -m pytest -q -x tests/test_fotmob.py tests/test_understat_espn.py tests/test_config.py

      - name: Run giornaliero (collect → predict → build)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS="${{ github.event.inputs.leagues }}"
          FLAGS=""
          if [ "${{ github.event.inputs.skip_predict }}" = "true" ]; then FLAGS="--skip-predict"; fi
          fda daily $ARGS $FLAGS 2>&1 | tee run.log | tail -80

      - name: Salva il log come artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-log-${{ github.run_number }}
          path: run.log
          retention-days: 7

      - name: Commit dei dati aggiornati
        run: |
          git config user.name "fda-bot"
          git config user.email "fda-bot@users.noreply.github.com"
          git add data/processed docs/STATO.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nessun dato nuovo"
          else
            git commit -m "data: run $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Prepara il sito per Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: run
    # Pages pubblica solo dal ramo predefinito (main): sugli altri rami il job viene saltato.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

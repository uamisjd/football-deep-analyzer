# Diagnostica: porta nel repository la coda del log di un run di Actions.
#
# Perché esiste (2026-09-15, docs/21 §16): l'agente lavora in un sandbox che non raggiunge il
# blob storage di GitHub, quindi i log dei run e gli artifact non sono leggibili da lì
# (`docs/00` §B6; verificato: EOF su results-receiver.blob e 403 su rerun/dispatch). Un runner
# di Actions invece li raggiunge: scarica l'artifact `run-log-*` del run indicato, ne prende la
# coda e la pubblica sul branch **`diag-logs`** (branch dedicato, non quello di lavoro: così il
# PR resta pulito e in `main` non finiscono log).
#
# Lettura da parte dell'agente:  git fetch origin diag-logs && git show origin/diag-logs:run-tail.txt
#
# Attivazione: dispatch dalla UI (utente) oppure modifica di `diag/trigger.txt` e push su un
# branch `arena/**` (agente). Costo: ~10 secondi, zero richieste alle fonti.
name: diag (log del run nel branch diag-logs)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID del run di cui scaricare l'artifact run-log-*"
        required: true
        default: "35037211442"
  push:
    branches:
      - "arena/**"
    paths:
      - "diag/trigger.txt"

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - id: rid
        run: |
          # Da dispatch: input della UI. Da push (agente): `run_id` scritto in diag/trigger.txt,
          # perché gli input non esistono sugli eventi push e il default era l'unico valore usato.
          rid="${{ github.event.inputs.run_id }}"
          if [ -z "$rid" ]; then
            rid=$(grep -oE 'run_id=[0-9]+' diag/trigger.txt 2>/dev/null | head -1 | cut -d= -f2)
          fi
          [ -z "$rid" ] && rid="35037211442"
          echo "run_id=$rid" >> "$GITHUB_OUTPUT"
          echo "run analizzato: $rid"

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          run-id: ${{ steps.rid.outputs.run_id }}
          pattern: "run-log-*"
          merge-multiple: true
          path: diag_raw
          github-token: ${{ github.token }}

      - name: Scarica il log dei job falliti (dai runner il blob storage è raggiungibile)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.rid.outputs.run_id }}
        run: |
          set -u
          mkdir -p diag_jobs
          # Perché serve: l'artifact `run-log-*` contiene solo l'output di `fda daily`, non quello
          # dei passi successivi. Quando il gate `verify_site` morde (run 35129006426, 2026-09-16)
          # l'elenco dei problemi resta nel log del *job*, che il sandbox dell'agente non può
          # scaricare (EOF sul blob storage): qui invece la rete funziona, quindi lo portiamo nel
          # repository. Nessun dato di fonte, nessuna richiesta esterna: solo API GitHub.
          # `--log-failed` (invece di `gh api .../jobs/{id}/logs`) perché la risposta dell'API è un
          # 302 verso il blob storage: `gh api` non lo segue e restituiva 0 righe.
          gh run view "$RUN_ID" --log-failed > diag_jobs/passi-falliti.log 2> diag_jobs/errore.txt || true
          wc -l diag_jobs/passi-falliti.log | tee diag_jobs/sommario.txt
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > /tmp/jobs.json || echo '{}' > /tmp/jobs.json
          python3 - <<'PYJSON'
          import json, pathlib, os
          data = json.loads(pathlib.Path("/tmp/jobs.json").read_text() or "{}")
          righe = [pathlib.Path("diag_jobs/sommario.txt").read_text().strip()]
          for job in data.get("jobs", []):
              if job.get("conclusion") != "failure":
                  continue
              righe.append(f"job {job.get('id')} «{job.get('name')}»: {job.get('conclusion')}")
              for s in job.get("steps", []):
                  if s.get("conclusion") == "failure":
                      righe.append(f"  passo fallito: {s.get('name')}")
          testo = "\n".join(righe) + "\n"
          pathlib.Path("diag_jobs/sommario.txt").write_text(testo)
          print(testo)
          PYJSON

      - name: Pubblica la coda sul branch diag-logs
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.rid.outputs.run_id }}
        run: |
          set -u
          out=/tmp/diaglogs
          mkdir -p "$out"
          log=$(find diag_raw -type f -name 'run.log' 2>/dev/null | head -1)
          if [ -n "$log" ]; then
            tail -200 "$log" > "$out/run-tail.txt"
            echo "coda scritta da $log ($(wc -l < "$out/run-tail.txt") righe)"
          else
            echo "artifact run-log-* non trovato per il run $RUN_ID" > "$out/run-tail.txt"
          fi
          # i log dei passi falliti (il gate verify_site stampa l'elenco dei problemi: è la riga
          # che serve quando il daily diventa rosso). Interi, non a coda: sono poche centinaia di righe.
          if [ -f diag_jobs/passi-falliti.log ]; then
            cp diag_jobs/passi-falliti.log "$out/passi-falliti.log"
            echo "passi falliti: $(wc -l < diag_jobs/passi-falliti.log) righe"
          fi
          [ -f diag_jobs/sommario.txt ] && cp diag_jobs/sommario.txt "$out/sommario.txt"
          {
            echo "run_id=$RUN_ID"
            echo "estratto_il=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "branch=${{ github.ref_name }}"
            echo "workflow_run_url=https://github.com/$REPO/actions/runs/$RUN_ID"
          } > "$out/run-tail-meta.txt"
          head -3 "$out/run-tail.txt"

          # il branch di lavoro non si tocca: la coda va su un branch dedicato, riscritto
          # ogni volta (interessa solo l'ultimo log)
          cd "$out"
          git init -q
          git config user.name "fda-diag"
          git config user.email "fda-diag@users.noreply.github.com"
          git add -A
          git commit -qm "diag: coda del log del run $RUN_ID"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/diag-logs
          echo "pubblicato su diag-logs"

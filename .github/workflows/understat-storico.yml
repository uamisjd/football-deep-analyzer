# Storico xG Understat (docs/90): stagioni precedenti per le 5 leghe coperte.
# Manuale: la sandbox di sviluppo non raggiunge understat.com, la CI sì (come il daily).
# Stesso gruppo di concorrenza del daily: i due run non scrivono mai i dati insieme.
name: understat-storico

on:
  workflow_dispatch:
    inputs:
      seasons_back:
        description: "Stagioni precedenti da scaricare"
        required: false
        default: "5"

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  storico:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installa il pacchetto
        run: pip install -q -e ".[dev]"

      - name: Scarica lo storico Understat
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          fda understat-storico --seasons-back "${{ github.event.inputs.seasons_back }}" 2>&1 | tee understat.log

      - name: Salva i dati (solo se cambiati)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/understat_matches.parquet data/processed/understat_team_matches.parquet
          if git diff --cached --quiet; then
            echo "nessun cambiamento"
          else
            git commit -q -m "Storico Understat: stagioni precedenti [skip ci]"
            git push -q origin "HEAD:${{ github.ref_name }}"
          fi

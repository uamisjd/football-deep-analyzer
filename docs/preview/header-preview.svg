<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" font-family="Sora, Inter, system-ui, Arial, sans-serif">
  <defs>
    <linearGradient id="cmg60" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ef0a8"/><stop offset="0.5" stop-color="#20c47e"/><stop offset="1" stop-color="#14925d"/>
    </linearGradient>
    <linearGradient id="cmgM60" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76a"/><stop offset="0.5" stop-color="#e7b23c"/><stop offset="1" stop-color="#c1851d"/>
    </linearGradient>
    <linearGradient id="cmbg60" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2d3d"/><stop offset="0.45" stop-color="#12202e"/><stop offset="1" stop-color="#0a1219"/>
    </linearGradient>
    <radialGradient id="cmgl60" cx="0.32" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="cmdrop60" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2.6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e141d"/><stop offset="1" stop-color="#0b1017"/>
    </linearGradient>
  </defs>

  <!-- header background -->
  <rect x="0" y="0" width="1200" height="200" fill="url(#hbg)"/>
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#1f2836" stroke-width="1"/>

  <!-- ===== CM LOGO (60px) ===== -->
  <g transform="translate(44,58)">
    <rect x="3" y="4" width="60" height="60" rx="18" fill="#000" opacity="0.35"/>
    <rect x="1.5" y="1.5" width="61" height="61" rx="18" fill="url(#cmbg60)" stroke="#2f4158" stroke-width="1.4"/>
    <rect x="1.5" y="1.5" width="61" height="61" rx="18" fill="url(#cmgl60)"/>
    <path d="M10 4.5 h44" stroke="#4a5e79" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <g filter="url(#cmdrop60)">
      <text x="32" y="45" text-anchor="middle" font-weight="800" font-size="36" letter-spacing="-1.5">
        <tspan fill="url(#cmg60)">C</tspan><tspan fill="url(#cmgM60)">M</tspan>
      </text>
    </g>
    <g stroke="#42566f" stroke-width="1.6" stroke-linecap="round">
      <path d="M12 52 h4"/><path d="M24 57 h4"/><path d="M36 57 h4"/><path d="M48 52 h4"/>
      <circle cx="32" cy="58" r="1.7" fill="#e7b23c" stroke="none"/>
    </g>
  </g>

  <!-- ===== WORDMARK CalcioMetro ===== -->
  <text x="152" y="112" font-weight="800" font-size="42" letter-spacing="-1.5">
    <tspan fill="#2ee59d">Calcio</tspan><tspan fill="#e7b23c">Metro</tspan>
  </text>
  <text x="154" y="146" fill="#93a0b3" font-weight="600" font-size="15" letter-spacing="0.5">Analisi calcistica profonda · 7 campionati</text>

  <!-- ===== NAV (7 voci) ===== -->
  <g font-weight="600" font-size="17">
    <!-- Oggi (attiva) -->
    <rect x="504" y="70" width="74" height="44" rx="11" fill="#28c893"/>
    <text x="541" y="92" text-anchor="middle" fill="#06231a" font-weight="700">Oggi</text>
    <text x="600" y="92" fill="#c4cedc">Prossime</text>
    <text x="700" y="92" fill="#c4cedc">Risultati</text>
    <text x="790" y="92" fill="#c4cedc">Accuratezza</text>
    <text x="906" y="92" fill="#c4cedc">Proiezioni</text>
    <text x="1008" y="92" fill="#c4cedc">Stato fonti</text>
    <text x="1118" y="92" fill="#c4cedc">Info</text>
  </g>

  <!-- ===== version badge ===== -->
  <g>
    <rect x="1110" y="130" width="42" height="26" rx="13" fill="#0f3126" stroke="#2c3850"/>
    <text x="1131" y="147" text-anchor="middle" fill="#2ee59d" font-weight="800" font-size="14">v2</text>
    <text x="1102" y="147" text-anchor="end" fill="#93a0b3" font-size="13">aggiornato 09/09/2026 10:28 (ora italiana)</text>
  </g>
</svg>

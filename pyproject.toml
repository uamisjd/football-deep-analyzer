[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-deep-analyzer"
version = "0.1.0"
description = "Analisi calcistica profonda con dati reali e gratuiti (7 campionati)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.0",
    "pyarrow>=15",
    "pyyaml>=6",
    "penaltyblog>=1.12",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]
plots = [
    "mplsoccer>=1.5",
    "matplotlib>=3.8",
    "plotly>=5.20",
]

[project.scripts]
fda = "fda.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fda.site" = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:penaltyblog.*",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-deep-analyzer"
version = "0.1.0"
description = "Analisi calcistica profonda con dati reali e gratuiti (7 campionati)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.0",
    "pyarrow>=15",
    "pyyaml>=6",
    "penaltyblog>=1.12",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13",
    # rilevamento della lingua dei titoli (is_italian_news, docs/25 §2):
    # pacchetto puro Python, offline, modelli inclusi — nessuna chiave, nessuna rete
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    # scripts/render_preview.py disegna i PNG di docs/preview (P2-8b): senza libreria
    # di sistema, ma la dipendenza va dichiarata o il tool non gira in un ambiente nuovo
    "pillow>=10",
    # scripts/resa_375.py misura la resa a 375 px senza browser: legge i .woff2 del sito e ne
    # ricava la larghezza dei testi (P2.8, docs/39). Gira in CI a ogni run: `brotli` serve a
    # decomprimere i woff2, `fonttools` a interrogarli.
    "fonttools>=4.50",
    "brotli>=1.1",
]
plots = [
    "mplsoccer>=1.5",
    "matplotlib>=3.8",
    "plotly>=5.20",
]

[project.scripts]
fda = "fda.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `templates/*.html`, `assets/*.css` e `assets/fonts/*` sono letti a runtime con
# `Path(__file__).parent/...` (FileSystemLoader di Jinja, `_write_assets`): senza questa
# dichiarazione un'installazione NON editable (`pip install .`) produce un pacchetto senza
# i file e `fda build` cade con FileNotFoundError. Verificato il 2026-09-17 costruendo la
# wheel: site.css mancava. Il glob dei font non corrisponde a nulla finché
# `scripts/font_locali.py` non è stato eseguito, e da allora porta con sé i woff2.
"fda.site" = ["templates/*.html", "assets/*.css", "assets/fonts/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Eccezioni deliberate (pulizia ruff del 18/09/2026, vedi docs/27 §5.2): il resto del codice
# è a zero segnalazioni. Questi moduli usano `except Exception`/`try…pass` come scelta
# documentata di progetto («se un passo cade, il run degrada e pubblica comunque», README):
# ignorarle qui NON le ignora nei file nuovi, dove restano vietate (regola B.4).
[tool.ruff.lint.per-file-ignores]
"src/fda/site/build.py" = ["BLE001", "S110"]
"src/fda/site/analysis.py" = ["BLE001"]
"src/fda/cli.py" = ["BLE001", "B008"]   # B008: typer.Argument in default è l'idioma di typer
"src/fda/models/predict.py" = ["BLE001"]
"src/fda/models/calibration.py" = ["BLE001"]
"src/fda/models/season_sim.py" = ["BLE001"]
"src/fda/models/lab.py" = ["BLE001"]
"src/fda/models/backtest.py" = ["BLE001"]
"src/fda/http.py" = ["BLE001"]
"src/fda/collect.py" = ["BLE001"]
"src/fda/backoff.py" = ["BLE001"]       # il wrapper di retry deve assorbire ogni errore di rete
"scripts/probe_fonti.py" = ["BLE001"]   # sonda diagnostica: ogni fonte deve fallire da sola
"scripts/parita_schede.py" = ["BLE001"]  # gate: fixtures illeggibili (qualsiasi errore) = non verificabile → exit 1
"tests/test_openmeteo.py" = ["DTZ001"]  # il codice sotto test usa datetime naive

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:penaltyblog.*",
]
